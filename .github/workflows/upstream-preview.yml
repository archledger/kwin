name: upstream master preview

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * 1"
  pull_request:
    branches: ["plasma-fusion"]
    paths:
      - ".github/upstream.json"
      - ".github/ci/**"
      - ".github/workflows/upstream-preview.yml"

permissions:
  contents: read

concurrency:
  group: upstream-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    name: "Development compatibility (advisory)"
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare an isolated upstream candidate
        run: |
          python3 .github/ci/upstream.py prepare \
            --repo "$GITHUB_WORKSPACE" --track preview \
            --output "$RUNNER_TEMP/upstream-preview/meta" \
            --source-dir "$RUNNER_TEMP/upstream-preview/candidate"

      - name: Prepare the hosted build environment
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          [ -e /dev/udmabuf ] || sudo modprobe udmabuf
          sudo chmod 0666 /dev/udmabuf

      - name: Build and test with the trusted fork recipes
        run: |
          "$GITHUB_WORKSPACE/.github/ci/suites.sh" \
            "$RUNNER_TEMP/upstream-preview/candidate" "$RUNNER_TEMP/upstream-preview/build"

      - name: Report the independent preview result
        if: always()
        run: |
          {
            echo 'This development preview does not promote source into plasma-fusion.'
            echo '```json'
            cat "$RUNNER_TEMP/upstream-preview/meta/result.json" 2>/dev/null || echo '{"status":"unavailable"}'
            echo '```'
            echo '```'
            cat "$RUNNER_TEMP/upstream-preview/build/out/STATUS" 2>/dev/null || echo 'Build not completed; inspect integration diagnostics.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: upstream-master-preview
          path: |
            ${{ runner.temp }}/upstream-preview/meta/
            ${{ runner.temp }}/upstream-preview/build/out/
          retention-days: 14
          if-no-files-found: warn
